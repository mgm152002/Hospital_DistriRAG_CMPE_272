  - { text: "pt Maria Gonzalez has a fever, what is our sepsis screen?", types: [NAME] }
  - { text: "MRN: 7734120 needs a transfusion, what are the vital sign checks?", types: [MRN] }
  - { text: "Call the family at (408) 555-0199 about discharge", types: [PHONE] }
  - { text: "Email the daughter at jane.doe@example.com with discharge instructions", types: [EMAIL] }
  - { text: "DOB 04/12/1958, can she have contrast?", types: [DOB] }
  - { text: "Date of birth: 1971-02-03 for the isolation patient", types: [DOB] }
  - { text: "SSN 123-45-6789 is on the consent form, is that ok?", types: [SSN] }
  - { text: "Mrs. Patel in room 4 refuses the pressure injury turn schedule", types: [NAME] }
  - { text: "Mr Johnson's wound dressing change steps?", types: [NAME] }
  - { text: "Patient named Ahmed Khan needs an interpreter for discharge", types: [NAME] }
  - { text: "She lives at 742 Evergreen Terrace Drive and needs transport", types: [ADDRESS] }
  - { text: "Send the heart failure sheet to 15 Maple Street", types: [ADDRESS] }
  - { text: "medical record number 55120034 had a fall", types: [MRN] }
  - { text: "Phone 650.555.0123 for the visitor", types: [PHONE] }
  - { text: "born on 7/4/1990, what's the hypoglycemia protocol?", types: [DOB] }
  - { text: "Patient Robert Lee with HR 125 and BP 85/50, what should I check?", types: [NAME] }
  - { text: "Ms. Okafor needs restraints, what is the policy?", types: [NAME] }
  - { text: "MRN#88231 code blue in bay 3", types: [MRN] }
  - { text: "Contact +1 415 555 0100 for pharmacy callback re: patient Lisa Wong", types: [PHONE, NAME] }
