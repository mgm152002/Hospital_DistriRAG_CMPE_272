# DistriRAG: continuous deployment to GCP.
# Every push to main builds the runtime image, pushes it to Artifact Registry tagged with the
# commit SHA, creates the GCE VM on first run, and rolls the new image out to it.
# GitHub reaches GCP through Workload Identity Federation: no service-account keys are stored.
# One-time setup: deploy/gcp/setup.sh (see deploy/gcp/README.md).
name: deploy-gcp
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "evals/**", "tests/**", "web/e2e/**"]
  workflow_dispatch:

concurrency:
  group: deploy-gcp
  cancel-in-progress: false   # never cancel a deploy half-way

permissions:
  contents: read
  id-token: write             # required for Workload Identity Federation

env:
  GCP_PROJECT: ${{ vars.GCP_PROJECT }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  GCP_ZONE: ${{ vars.GCP_ZONE || 'us-central1-a' }}
  GCP_VM: ${{ vars.GCP_VM || 'distrirag-vm' }}
  GCP_MACHINE: ${{ vars.GCP_MACHINE || 'e2-medium' }}
  GCP_AR_REPO: ${{ vars.GCP_AR_REPO || 'distrirag' }}
  GCP_DOMAIN: ${{ vars.GCP_DOMAIN }}           # optional; empty serves plain HTTP on the VM's IP

jobs:
  build-and-push:
    if: vars.GCP_PROJECT != ''   # skipped until setup.sh has configured the repository
    runs-on: ubuntu-24.04
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
      - id: tag
        run: echo "tag=$GCP_REGION-docker.pkg.dev/$GCP_PROJECT/$GCP_AR_REPO/app:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          build-args: EXTRAS=minilm,s3,azure
          load: true
          tags: ${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image only ships if it imports the app cleanly.
      - run: docker run --rm "${{ steps.tag.outputs.tag }}" python -c "import run; print('image imports ok')"
      - run: docker push "${{ steps.tag.outputs.tag }}"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud config set project "$GCP_PROJECT"

      - name: Create the VM on first deploy
        run: |
          if gcloud compute instances describe "$GCP_VM" --zone="$GCP_ZONE" >/dev/null 2>&1; then
            echo "VM $GCP_VM exists"; exit 0
          fi
          gcloud compute instances create "$GCP_VM" --zone="$GCP_ZONE" \
            --machine-type="$GCP_MACHINE" \
            --image-family=ubuntu-2404-lts-amd64 --image-project=ubuntu-os-cloud \
            --boot-disk-size=30GB --boot-disk-type=pd-balanced \
            --address=distrirag-ip --tags=distrirag \
            --service-account="distrirag-vm@$GCP_PROJECT.iam.gserviceaccount.com" --scopes=cloud-platform \
            --metadata=enable-oslogin=TRUE,repo-url=https://github.com/${{ github.repository }}.git \
            --metadata-from-file=startup-script=deploy/gcp/vm-startup.sh

      - name: Wait for the VM to finish provisioning
        run: |
          for i in $(seq 1 40); do
            gcloud compute ssh "$GCP_VM" --zone="$GCP_ZONE" --quiet --command 'test -f /var/lib/distrirag-ready' 2>/dev/null && exit 0
            sleep 15
          done
          echo "VM never became ready"; exit 1

      - name: Roll out the new image
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          remote="
            set -euo pipefail
            sudo git -C /opt/distrirag -c safe.directory=/opt/distrirag fetch --quiet origin $GITHUB_SHA
            sudo git -C /opt/distrirag -c safe.directory=/opt/distrirag checkout --quiet --force --detach $GITHUB_SHA
            sudo IMAGE_TAG=$IMAGE_TAG DOMAIN=$GCP_DOMAIN bash /opt/distrirag/deploy/gcp/rollout.sh
          "
          # Exit 255 is ssh itself (OS Login keys can lag on a fresh VM); retry that, fail fast on anything else.
          for i in 1 2 3 4 5; do
            set +e
            printf '%s' "$APP_ENV" | gcloud compute ssh "$GCP_VM" --zone="$GCP_ZONE" --quiet --command "$remote"
            rc=$?
            set -e
            [ "$rc" -ne 255 ] && exit "$rc"
            echo "ssh failed (attempt $i), retrying"; sleep 15
          done
          exit 255

      - name: Smoke-test the public URL
        run: |
          if [ -n "$GCP_DOMAIN" ]; then URL="https://$GCP_DOMAIN"; else
            URL="http://$(gcloud compute addresses describe distrirag-ip --region="$GCP_REGION" --format='value(address)')"
          fi
          for i in $(seq 1 30); do curl -sf "$URL/readyz" && { echo "live at $URL" >> "$GITHUB_STEP_SUMMARY"; exit 0; }; sleep 10; done
          echo "$URL/readyz did not answer"; exit 1
