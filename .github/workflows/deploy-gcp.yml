# DistriRAG: deploy to GCP.
# Route: build the runtime image once, push it to Artifact Registry, and roll it out
# to the GCE VM that runs deploy/docker-compose.yml + deploy/cloud/docker-compose.cloud.yml
# (Caddy HTTPS). No long-lived GCP keys: Workload Identity Federation (deploy/gcp/README.md).
#
# Triggers: after the `ci` workflow passes on a push to main, or manually.
# Until the GCP repository variables are set (GCP_PROJECT etc.), every job is skipped,
# so pushes before setup stay green.
name: deploy-gcp
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-gcp
  cancel-in-progress: false   # never cancel a deploy half-way

permissions:
  contents: read
  id-token: write             # required for Workload Identity Federation

env:
  GCP_PROJECT: ${{ vars.GCP_PROJECT }}       # e.g. distrirag-prod
  GCP_REGION: ${{ vars.GCP_REGION }}         # e.g. us-central1
  GCP_ZONE: ${{ vars.GCP_ZONE }}             # e.g. us-central1-a
  GCP_VM: ${{ vars.GCP_VM }}                 # e.g. distrirag-vm
  GCP_DOMAIN: ${{ vars.GCP_DOMAIN }}         # public hostname served by Caddy
  AR_REPO: ${{ vars.GCP_AR_REPO || 'distrirag' }}
  # The commit to deploy: the one CI tested, or the dispatched ref.
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build-and-push:
    # Deploy only commits whose CI passed on a push (not nightly or PR runs), and only once configured.
    if: >-
      vars.GCP_PROJECT != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.DEPLOY_SHA }}" }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
      - id: tag
        run: echo "tag=$GCP_REGION-docker.pkg.dev/$GCP_PROJECT/$AR_REPO/app:$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          build-args: EXTRAS=minilm,s3,azure
          load: true
          tags: ${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image only ships if it starts Python and imports the app cleanly.
      - run: docker run --rm "${{ steps.tag.outputs.tag }}" python -c "import run; print('image imports ok')"
      - run: docker push "${{ steps.tag.outputs.tag }}"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Roll out on the VM
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          gcloud compute ssh "$GCP_VM" --project="$GCP_PROJECT" --zone="$GCP_ZONE" --quiet --command "
            set -euo pipefail
            cd /opt/distrirag
            sudo git -c safe.directory=/opt/distrirag fetch --quiet origin $DEPLOY_SHA
            sudo git -c safe.directory=/opt/distrirag checkout --quiet --detach $DEPLOY_SHA
            sudo gcloud auth configure-docker $GCP_REGION-docker.pkg.dev --quiet
            export IMAGE_TAG=$IMAGE_TAG DOMAIN=$GCP_DOMAIN
            DC='sudo -E docker compose -f deploy/docker-compose.yml -f deploy/cloud/docker-compose.cloud.yml --profile lite'
            \$DC pull app
            \$DC up -d --no-build app caddy
            # The cloud overlay does not publish port 8000, so check readiness from inside the container.
            for i in \$(seq 1 60); do
              \$DC exec -T app python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3)\" && exit 0
              sleep 3
            done
            echo 'app never became ready'; \$DC logs --tail=100 app; exit 1
          "
      - name: Smoke-test the public URL
        run: |
          for i in $(seq 1 30); do curl -sf "https://$GCP_DOMAIN/readyz" && exit 0; sleep 10; done
          echo "https://$GCP_DOMAIN/readyz did not answer"; exit 1
