name: distrirag-test
x-test: &test
  build: { context: .., target: dev }
  extra_hosts: [ "host.docker.internal:host-gateway" ]
  image: distrirag:dev
  working_dir: /app
  volumes: [ "..:/app" ]
  environment:
    PYTHONPATH: /app
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: distrirag, POSTGRES_PASSWORD: distrirag, POSTGRES_DB: distrirag }
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=60", "-c", "fsync=off"]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "distrirag"], interval: 2s, retries: 30 }
    tmpfs: [ /var/lib/postgresql/data ]
  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 2s, retries: 30 }
  s3:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-ip.bind=0.0.0.0", "-dir=/data", "-s3", "-s3.port=8333", "-master.volumeSizeLimitMB=64", "-volume.max=8"]
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:8333/status"], interval: 2s, retries: 60 }
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--skipApiVersionCheck", "--loose"]
  web:
    image: node:20-alpine
    working_dir: /web
    volumes: [ "../web:/web", "web_node_modules:/web/node_modules" ]
    command: ["sh", "-c", "npm install --no-audit --no-fund --loglevel=error && npm test"]
  e2e:
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    working_dir: /web
    volumes: [ "../web:/web", "e2e_node_modules:/web/node_modules" ]
    environment: { BASE_URL: "${BASE_URL:-http://host.docker.internal:8000}" }
    extra_hosts: [ "host.docker.internal:host-gateway" ]
    command: ["sh", "-c", "npm install --no-audit --no-fund --loglevel=error && npx playwright test"]
  unit:
    <<: *test
    command: ["pytest", "-q", "tests/unit"]
  lint:
    <<: *test
    command: ["sh", "-c", "ruff check . && mypy common api pipeline search assistant documents"]
  integration:
    <<: *test
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3: { condition: service_healthy }
      azurite: { condition: service_started }
    environment:
      PYTHONPATH: /app
      S3_ENDPOINT_URL: http://s3:8333
      AWS_ACCESS_KEY_ID: any
      AWS_SECRET_ACCESS_KEY: any
      AWS_DEFAULT_REGION: us-east-1
      AZURE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      DATABASE_URL: postgresql://distrirag:distrirag@postgres:5432/distrirag
      REDIS_URL: redis://redis:6379/0
    command: ["pytest", "-q", "-m", "integration", "tests/integration"]
volumes: { web_node_modules: {}, e2e_node_modules: {} }
